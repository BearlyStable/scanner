name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# No API token needed — configure a pending publisher on PyPI that matches this
# repo, workflow, and environment.
#
# Tag push is the *only* trigger. Publishing a GitHub Release used to fire this
# too, which meant writing up the release notes for an already-published tag
# re-ran the whole job and failed at the upload step, since a PyPI version can
# never be replaced. Cutting the tag publishes; the Release is just notes.
# To retry a genuinely failed publish, re-run the job from the Actions tab.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
