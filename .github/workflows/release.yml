name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# No API token needed — configure a pending publisher on PyPI that matches this
# repo, workflow, and environment.
#
# Tag push is the *only* trigger. Publishing a GitHub Release used to fire this
# too, which meant writing up the release notes for an already-published tag
# re-ran the whole job and failed at the upload step, since a PyPI version can
# never be replaced. Cutting the tag publishes; the Release is just notes.
# To retry a genuinely failed publish, re-run the job from the Actions tab.
#
# The suite runs first and gates the build -- the full matrix in ci.yml, not
# one Python: a tag on a red commit publishes nothing, which matters because a
# PyPI version can never be replaced.
#
# Actions are pinned to commit SHAs, each checked against the tag in its
# upstream repo that the trailing comment names. A tag can be moved after the
# fact; a commit cannot.
on:
  push:
    tags:
      - "v*"

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      # A PyPI version can never be replaced, so a tag that disagrees with
      # __version__ (which the build reads) must fail here, not at the upload.
      - name: Check the tag matches __version__
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('tcpsweep.py').read_text()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match __version__ $version" >&2
            exit 1
          fi

  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  build:
    name: Build distribution
    needs: [tag, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
