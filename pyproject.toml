[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcpsweep"
description = "A netcat-style TCP connect sweep in a single, dependency-free Python file."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philipp Herkert", email = "philipp.herkert@gmail.com" }]
keywords = ["portscan", "network", "tcp", "scanner", "netcat", "security", "recon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/BearlyStable/scanner"
Repository = "https://github.com/BearlyStable/scanner"
Issues = "https://github.com/BearlyStable/scanner/issues"

[project.scripts]
tcpsweep = "tcpsweep:main"

[tool.hatch.version]
path = "tcpsweep.py"

[tool.hatch.build.targets.wheel]
only-include = ["tcpsweep.py"]

[tool.hatch.build.targets.sdist]
include = ["tcpsweep.py", "test_scan.py", "README.md", "LICENSE"]
